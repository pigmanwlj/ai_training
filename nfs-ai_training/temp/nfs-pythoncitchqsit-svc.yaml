apiVersion: v1
kind: Service
metadata:
  name: nfs-pythoncit-svc
  namespace: pythoncit
spec:
  type: NodePort
  selector:
    app: nfs-pythoncit
  ports:
  - name: nfs-pythoncit
    port: 8000
    targetPort: 8000
    nodePort: 32068

---
apiVersion: v1
kind: Service
metadata:
  name: nfs-pythoncit-nginx-svc
  namespace: pythoncit
spec:
  type: NodePort
  selector:
    app: nfs-pythoncit-nginx
  ports:
  - name: nfs-pythoncit-nginx
    port: 80
    targetPort: 80
    nodePort: 32069

---
apiVersion: v1
kind: Service
metadata:
  name: nfs-redis-pythoncit-svc
  namespace: pythoncit
spec:
  #type: NodePort
  type: ClusterIP
  selector:
    app: nfs-redis-pythoncit
  ports:
  - name: nfs-redis-pythoncit
    port: 6379
    targetPort: 6379
    #nodePort: 30373


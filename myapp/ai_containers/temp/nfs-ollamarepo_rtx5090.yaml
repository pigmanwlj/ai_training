apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nfs-ollamarepo
  name: nfs-ollamarepo
  namespace: ai-training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-ollamarepo
  template:
    metadata:
      labels:
        app: nfs-ollamarepo
    spec:
      containers:
      - image: ollama/ollama:latest
        imagePullPolicy: "IfNotPresent"
        name: ollamarepo
        env:
        - name: TZ
          value: Asia/Shanghai
        volumeMounts:    #定义数据持久化
          - name: nfs-chqsit
            mountPath: /root/.ollama
            #subPath: cit
      volumes:
        - name: nfs-chqsit
          hostPath:
            path: /data/ollama/training

